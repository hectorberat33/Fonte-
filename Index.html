<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonte">
<meta name="theme-color" content="#060708">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Fonte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800;1,900&display=swap">
<style>
/* Layout : en-tête collant (marque, chrono, séances, progression), liste en accordéon (exercice en cours ouvert), surcouches repos / motivation / bilan */
:root{
  --bg:#060708; --panel:#0E1013; --panel2:#14171B; --panel3:#1B1F24; --line:#1E2227; --line2:#2C3138;
  --fg:#F4F4F1; --soft:#C7CBD0; --muted:#8C929A; --dim:#5A6068;
  --y:#FFD60A; --y-hi:#FFE55C; --ink:#0A0A0A; --red:#FF3030; --red-sec:#64383B;
  --ff-d:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --ff-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sk{transform:skewX(-12deg)}
.sk>span{display:flex;align-items:center;justify-content:center;gap:7px;transform:skewX(12deg);height:100%}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,7,8,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px 9px}
.brand{display:flex;align-items:center;gap:7px;font:italic 900 22px/1 var(--ff-d);letter-spacing:.03em}
.brand svg{width:13px;height:19px;fill:var(--y);filter:drop-shadow(0 0 6px rgba(255,214,10,.55))}
.chrono{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.chrono .lbl{font:600 9.5px/1 var(--ff-b);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chrono .time{font:italic 800 31px/1 var(--ff-d);font-variant-numeric:tabular-nums;color:var(--dim);margin-top:2px}
.chrono .time.live{color:var(--y);text-shadow:0 0 18px rgba(255,214,10,.35)}
.go{flex:none;height:44px;padding:0 16px;border:0;border-radius:5px;background:var(--y);color:var(--ink);font:italic 800 16px/1 var(--ff-d);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 22px rgba(255,214,10,.25)}
.go svg{width:12px;height:12px;fill:currentColor}
.go.run{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line2)}
.go.confirm{background:var(--red);color:#fff;box-shadow:0 0 22px rgba(255,48,48,.35)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 5px 10px}
.tab{height:40px;border:1px solid var(--line2);border-radius:4px;background:var(--panel);color:var(--muted);font:italic 700 15px/1 var(--ff-d);letter-spacing:.06em;text-transform:uppercase;padding:0 4px;white-space:nowrap}
.tab.on{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 0 18px rgba(255,214,10,.22)}
.prog{display:flex;align-items:center;gap:10px;padding-bottom:11px}
.segs{flex:1;display:flex;gap:2px;min-width:0}
.segs i{flex:1;height:4px;background:var(--line2);transform:skewX(-24deg);border-radius:1px}
.segs i.on{background:var(--y);box-shadow:0 0 6px rgba(255,214,10,.55)}
.segs i.gap{flex:0 0 5px;background:none}
.prog span{font:italic 700 14px/1 var(--ff-d);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog span b{color:var(--fg)}

/* Intro de séance */
.hero{padding-block:24px 4px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:6px;width:150px;height:150px;background:linear-gradient(135deg,transparent 46%,rgba(255,214,10,.10) 46%,rgba(255,214,10,.10) 54%,transparent 54%);pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 9px;font:600 11px/1 var(--ff-b);letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--y)}
.hero h1{margin:0;font:italic 900 54px/.86 var(--ff-d);text-transform:uppercase;letter-spacing:-.005em;text-wrap:balance}
.hero h1 em{font-style:inherit;color:var(--y)}
.facts-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:6px 10px;border-radius:3px;font:600 12px/1 var(--ff-b);color:var(--muted);background:var(--panel)}
.chip b{color:var(--fg);font-weight:700}
.last{margin:11px 0 0;font-size:13px;color:var(--dim)}
.last b{color:var(--soft);font-weight:600}

/* Accordéon d'exercices */
.list{display:grid;gap:10px;padding-block:18px 150px}
.sec{display:flex;align-items:baseline;gap:10px;margin:12px 0 0;padding-left:2px}
.sec h2{margin:0;font:italic 900 26px/1 var(--ff-d);text-transform:uppercase}
.sec span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.blk{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;scroll-margin-top:176px}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.blk.open{border-color:var(--line2);background:linear-gradient(180deg,#121519 0%,#0C0E11 100%)}
.blk.open::before{background:var(--y);box-shadow:0 0 12px rgba(255,214,10,.6)}
.blk.done:not(.open){opacity:.62}
.bh{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:13px 14px 13px 13px;background:none;border:0;text-align:left}
.idx{font:italic 900 30px/1 var(--ff-d);color:var(--y);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.blk.done .idx{color:var(--dim)}
.nm{display:block;font:600 16px/1.2 var(--ff-b);text-wrap:balance}
.sub{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:4px}
.st i{width:9px;height:12px;background:var(--line2);transform:skewX(-16deg);border-radius:1px}
.st i.on{background:var(--y)}
.ok{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;background:var(--y);color:var(--ink);font:italic 800 12px/1 var(--ff-d);letter-spacing:.08em;text-transform:uppercase;border-radius:2px}
.ok svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3}
.bb{display:grid;gap:12px;padding:0 13px 16px}

/* Scène animée */
.stage{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(110% 85% at 50% 72%,#171A20 0%,#0B0C0F 62%,#070809 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.stage svg{position:relative;display:block;width:100%;height:100%}
.hud{position:absolute;width:13px;height:13px;border:0 solid var(--y);opacity:.85;pointer-events:none}
.hud.a{top:8px;left:8px;border-width:2px 0 0 2px}.hud.b{top:8px;right:8px;border-width:2px 2px 0 0}
.hud.c{bottom:8px;left:8px;border-width:0 0 2px 2px}.hud.d{bottom:8px;right:8px;border-width:0 2px 2px 0}
.tempo{position:absolute;top:11px;left:28px;font:600 9.5px/1 var(--ff-b);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tempo b{color:var(--y);font-weight:700}
.phase{position:absolute;top:11px;right:28px;font:italic 800 11px/1 var(--ff-d);letter-spacing:.14em;text-transform:uppercase;color:var(--y);min-width:72px;text-align:right}
.mus{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.mc{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(6,7,8,.78);border:1px solid var(--line2);border-radius:2px;font:600 10px/1 var(--ff-b);letter-spacing:.1em;text-transform:uppercase}
.mc i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red)}
.mc.s{color:var(--muted)}.mc.s i{background:var(--red-sec);box-shadow:none}
.ssname{display:flex;align-items:baseline;gap:8px;margin:2px 0 -4px;font:600 15px/1.2 var(--ff-b)}
.ssname b{font:italic 900 18px/1 var(--ff-d);color:var(--y)}

/* Réglages */
.ctrl{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:8px}
.cell{display:flex;flex-direction:column;gap:7px;min-width:0;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;text-align:left}
.lab{font:600 9.5px/1 var(--ff-b);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{flex:none;width:44px;height:44px;border-radius:5px;border:1px solid var(--line2);background:var(--panel3);font:500 24px/1 var(--ff-b);display:grid;place-items:center}
.stp button:active{background:var(--y);color:var(--ink);border-color:var(--y)}
.w{flex:1;min-width:0;width:100%;height:44px;padding:0;border:0;border-bottom:2px solid var(--line2);border-radius:0;background:transparent;color:var(--fg);text-align:center;font:italic 800 34px/1 var(--ff-d);font-variant-numeric:tabular-nums}
.w:focus{outline:none;border-bottom-color:var(--y)}
.w::placeholder{color:var(--dim)}
.unit{font-size:12px;color:var(--muted);text-align:center}
.side{display:grid;gap:8px;min-width:0}
.val{font:italic 800 23px/1 var(--ff-d);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val small{font:600 12px var(--ff-b);color:var(--muted);font-style:normal;margin-left:3px}
.rp{border-color:var(--line2)}
.rp .val{color:var(--y)}
.rp .lab::after{content:" · modifier";color:var(--dim);letter-spacing:.06em;text-transform:none;font-weight:500}

/* Pauses */
.pzs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;padding:0 5px}
.pz{height:60px;border:1.5px solid var(--line2);border-radius:4px;background:var(--panel2);color:var(--muted);transform:skewX(-10deg);padding:0}
.pz>span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:skewX(10deg);height:100%}
.pz b{font:italic 800 19px/1 var(--ff-d);letter-spacing:.05em;text-transform:uppercase}
.pz small{font:600 11px/1 var(--ff-b);color:var(--dim);font-variant-numeric:tabular-nums}
.pz.next{border-color:var(--y);color:var(--y);animation:pulse 1.9s ease-in-out infinite}
.pz.next small{color:var(--soft)}
.pz.done{background:var(--y);border-color:var(--y);color:var(--ink)}
.pz.done small{color:rgba(10,10,10,.65)}
.pz.run{background:rgba(255,214,10,.14);border-color:var(--y);color:var(--y)}
.pz.run small{color:var(--fg)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,0)}50%{box-shadow:0 0 0 3px rgba(255,214,10,.16),0 0 20px rgba(255,214,10,.28)}}
.hint{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.hint b{color:var(--fg);font-weight:600}
.tech{border-top:1px solid var(--line);padding-top:12px}
.tech .lab{color:var(--y)}
.tech p{margin:7px 0 0;font-size:14px;line-height:1.5;color:var(--soft);max-width:62ch}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:8px 0 0}

/* Repos */
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest{background:radial-gradient(85% 55% at 50% 40%,#17150A 0%,#070708 72%)}
.rest-top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between}
.rlbl{font:italic 800 18px/1 var(--ff-d);letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
.rlbl small{color:var(--muted);font-size:14px;margin-left:4px}
.ghost{height:40px;padding:0 14px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);font:600 13px/1 var(--ff-b)}
.ring{position:relative;width:min(76vw,330px);aspect-ratio:1;margin:auto 0 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:#1C1F24;stroke-width:9}
.ring .fgc{fill:none;stroke:var(--y);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,214,10,.55))}
.ring .tk{stroke:#2B3037;stroke-width:2}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rt{font:italic 900 min(26vw,112px)/1 var(--ff-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rs{margin-top:4px;font:600 11px/1 var(--ff-b);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.rest.warn .rt{color:var(--y);animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.06)}}
.rex{margin:22px 0 0;font:600 17px/1.25 var(--ff-b);text-align:center;text-wrap:balance}
.rnext{margin:8px 0 0;font-size:14px;color:var(--muted);text-align:center}
.rnext b{color:var(--y);font-weight:600}
.rbtns{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:9px;margin-top:auto;padding:0 5px}
.rbtns button{height:56px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);font:italic 800 18px/1 var(--ff-d);letter-spacing:.06em;text-transform:uppercase}
.rbtns .skip{background:var(--y);border-color:var(--y);color:var(--ink)}
.mini{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;height:54px;padding:0 18px 0 16px;border:1.5px solid var(--y);border-radius:6px;background:#0D0E10;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 22px rgba(255,214,10,.2);overflow:hidden}
.mini span{font:600 10px/1 var(--ff-b);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mini b{font:italic 900 26px/1 var(--ff-d);color:var(--y);font-variant-numeric:tabular-nums}
.mini i{position:absolute;left:0;bottom:0;height:3px;background:var(--y);width:100%;transform-origin:left}

/* Motivation */
.hype{background:var(--y);color:var(--ink);justify-content:center;overflow:hidden}
.hype::before{content:"";position:absolute;inset:-40%;background:repeating-linear-gradient(-60deg,rgba(0,0,0,.045) 0 18px,transparent 18px 46px);animation:slide 6s linear infinite}
@keyframes slide{to{transform:translateX(92px)}}
.hype>*{position:relative}
.hy-bolt{width:64px;height:88px;margin-bottom:22px}
.hy-bolt path{fill:var(--ink);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.hype.on .hy-bolt{animation:zap .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes zap{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.hy-kick{font:600 11px/1 var(--ff-b);letter-spacing:.26em;text-transform:uppercase;opacity:.7}
.hy-t{margin:10px 0 0;font:italic 900 min(17vw,78px)/.86 var(--ff-d);text-transform:uppercase;text-align:center;text-wrap:balance;max-width:11ch}
.hype.on .hy-t{animation:punch .55s .08s cubic-bezier(.2,1.4,.4,1) both}
@keyframes punch{0%{transform:translateX(-30px) skewX(-14deg);opacity:0}100%{transform:none;opacity:1}}
.hy-s{margin:14px 0 0;font:600 17px/1.35 var(--ff-b);text-align:center;max-width:30ch}
.hy-tg{margin:18px 0 0;padding:9px 14px;background:var(--ink);color:var(--y);font:italic 800 16px/1 var(--ff-d);letter-spacing:.06em;text-transform:uppercase;transform:skewX(-10deg)}
.hy-tg span{display:block;transform:skewX(10deg)}
.hy-go{position:relative;width:min(100%,420px);height:62px;margin-top:34px;border:0;border-radius:4px;background:var(--ink);color:var(--y);font:italic 900 22px/1 var(--ff-d);letter-spacing:.1em;text-transform:uppercase;overflow:hidden}
.hy-go i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--y);transform-origin:left}
.hype.on .hy-go i{animation:drain 5s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}

/* Bilan */
.sum{background:rgba(4,5,6,.96);justify-content:center}
.sum-in{width:100%;max-width:460px;display:grid;gap:16px}
.sum h2{margin:0;font:italic 900 46px/.9 var(--ff-d);text-transform:uppercase}
.sum h2 em{font-style:inherit;color:var(--y)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:5px}
.stats b{display:block;font:italic 900 28px/1 var(--ff-d);color:var(--y);font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:5px;font:600 9.5px/1 var(--ff-b);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.loads{max-height:38vh;overflow:auto;border-top:1px solid var(--line)}
.loads div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.loads div span{color:var(--soft);min-width:0}
.loads div b{font:italic 800 17px/1.1 var(--ff-d);white-space:nowrap}
.big{height:56px;border:0;border-radius:4px;background:var(--y);color:var(--ink);font:italic 900 20px/1 var(--ff-d);letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);z-index:45;padding:11px 16px;background:var(--y);color:var(--ink);border-radius:3px;font:italic 800 15px/1 var(--ff-d);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.hero h1{font-size:46px}.tab{font-size:13.5px}.pz b{font-size:17px}.chrono .time{font-size:27px}.go{padding:0 12px}}
@media (prefers-reduced-motion:reduce){.pz.next,.rest.warn .rt,.hype::before{animation:none}}

/* Dessins */
.fr{stroke:#2B2F35;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.frh{stroke:#474D55;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pad{stroke:#131517;stroke-linecap:round}
.padh{stroke:#23272C;stroke-linecap:round}
.ya{stroke:#8F7200;stroke-width:6.6;stroke-linecap:round}
.yb{stroke:#FFD60A;stroke-width:4.8;stroke-linecap:round}
.yc{stroke:#FFF1A6;stroke-width:1;stroke-linecap:round;opacity:.6}
.dk{stroke:#16181B;stroke-width:4.2;stroke-linecap:round}
.dkh{stroke:#4A5058;stroke-width:.9;stroke-linecap:round}
.pl1{fill:#111316;stroke:#3C4149;stroke-width:1.4}
.pl2{fill:none;stroke:#23272C;stroke-width:1.1}
.hub{fill:#B9BFC6}

<script>
(function(){
"use strict";
/* ===== Moteur d'animation Fonte : corps anatomique + machines ===== */
const D=Math.PI/180, LEN={t:34,n:4,h:6.5,ua:19,fa:17,th:23,sh:22};
const f=n=>Math.round(n*100)/100;
const P2=p=>f(p[0])+" "+f(p[1]);
const dir=a=>[Math.cos(a*D),Math.sin(a*D)];
const pt=(p,a,l)=>[p[0]+Math.cos(a*D)*l,p[1]+Math.sin(a*D)*l];
const add=(p,v,s)=>{s=s===undefined?1:s;return [p[0]+v[0]*s,p[1]+v[1]*s];};
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const len=v=>Math.hypot(v[0],v[1]);
const ang=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0])/D;
const along=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];
const seg=(p,v,l)=>Array.isArray(v)?[p[0]+v[0],p[1]+v[1]]:pt(p,v,l);
const mir=v=>Array.isArray(v)?[-v[0],v[1]]:180-v;
const lin=(a,b,n)=>{const r=[];for(let i=0;i<n;i++)r.push(a+(b-a)*i/(n-1));return r;};
function lerp(a,b,k){if(b===undefined)return a;if(typeof a==="number")return a+(b-a)*k;if(Array.isArray(a))return a.map((x,i)=>x+(b[i]-x)*k);return a;}
function mix(A,B,k){const o={};for(const key in A)o[key]=lerp(A[key],B[key],k);return o;}
function smooth(ps,closed){
  const n=ps.length;if(n<2)return "";
  let d="M"+P2(ps[0]);const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const p0=ps[closed?(i-1+n)%n:Math.max(i-1,0)],p1=ps[i],p2=ps[(i+1)%n],p3=ps[closed?(i+2)%n:Math.min(i+2,n-1)];
    d+="C"+P2([p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6])+" "+P2([p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6])+" "+P2(p2);
  }
  return d+(closed?"Z":"");
}
const poly=ps=>"M"+ps.map(P2).join("L");
function pin(pr,t,i){if(t<=pr[0][0])return pr[0][i];for(let j=1;j<pr.length;j++){if(t<=pr[j][0]){const a=pr[j-1],b=pr[j],u=(t-a[0])/(b[0]-a[0]);return a[i]+(b[i]-a[i])*u;}}return pr[pr.length-1][i];}
function ik(S,H,d,sc){
  const a=LEN.ua*sc,b=LEN.fa*sc;let L=Math.hypot(H[0]-S[0],H[1]-S[1]);
  L=Math.min(Math.max(L,Math.abs(a-b)+.5),a+b-.01);
  const c=(a*a+L*L-b*b)/(2*a*L),o=Math.acos(Math.max(-1,Math.min(1,c)))/D;
  const E=pt(S,ang(S,H)+d*o,a);return [E,pt(E,ang(E,H),b)];
}

/* ---------- Couleurs du corps ---------- */
const C={body:"#545B64",bodyF:"#30353B",mus:"#68707A",musF:"#3D434A",edge:"#050607",hair:"#141517",shorts:"#0F1113",shortsF:"#0A0B0C",shoe:"#121416",sole:"#3C424A",stripe:"#FFD60A"};
const rgb=c=>"rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
const lc=(a,b,k)=>a.map((x,i)=>x+(b[i]-x)*k);
function mcol(R,key){
  if(R.prim.has(key))return rgb(R.far?lc([92,16,20],[150,24,26],R.k):lc([150,18,22],[255,40,34],R.k));
  if(R.sec.has(key))return R.far?"#3E2A2D":"#64383B";
  return R.far?C.musF:C.mus;
}
function fcol(R,key){
  if(R.prim.has(key))return "rgba(255,"+(200-70*R.k|0)+","+(190-70*R.k|0)+","+(.28+.42*R.k).toFixed(2)+")";
  if(R.sec.has(key))return "rgba(255,150,140,.16)";
  return "rgba(6,8,10,.42)";
}

/* ---------- Profils anatomiques (vue de profil) [t, avant, arrière] ---------- */
const TO=[[-.12,4.6,6.4],[0,6.6,8.0],[.15,6.5,6.8],[.3,6.3,5.7],[.48,6.9,5.9],[.63,8.1,6.9],[.78,9.5,7.7],[.9,9.0,7.5],[1,6.6,6.5],[1.07,4.3,5.0]];
const TO_M=[{key:"abs",side:1,t0:.06,t1:.6,in:.5,seg:[.2,.33,.46]},{key:"lat",side:-1,t0:.36,t1:.96,in:.32},{key:"trap",side:-1,t0:.86,t1:1.08,in:.3},{key:"pec",side:1,t0:.6,t1:1.03,in:.28,b:1.6}];
const NECK=[[0,4.4,5.0],[1,3.3,3.5]];
const UA=[[-.14,3.6,4.2],[0,5.4,5.5],[.18,5.1,5.1],[.42,5.0,4.7],[.66,4.3,4.3],[.88,3.4,3.5],[1.03,2.8,3.0]];
const UA_M=[{key:"tri",side:-1,t0:.1,t1:.9,in:.22,b:1.3},{key:"bi",side:1,t0:.22,t1:.9,in:.22,b:1.5},{key:"delt",side:0,t0:-.14,t1:.5,b:1}];
const FA=[[-.06,3.0,3.1],[.18,3.9,3.5],[.45,3.3,3.0],[.8,2.3,2.1],[1,1.9,1.8]];
const FA_M=[{key:"fore",side:1,t0:0,t1:.78,in:.32},{key:"fore",side:-1,t0:.02,t1:.7,in:.4}];
const TH=[[-.06,6.0,6.8],[.15,6.5,6.3],[.45,6.0,5.4],[.75,5.0,4.4],[.95,4.0,3.8],[1.05,3.6,3.6]];
const TH_M=[{key:"quad",side:1,t0:.12,t1:1,in:.3},{key:"ham",side:-1,t0:.1,t1:.92,in:.3}];
const SH=[[-.04,3.6,3.7],[.15,3.0,4.8],[.35,2.8,5.0],[.6,2.4,3.4],[.9,1.9,2.1],[1.03,1.8,2.0]];
const SH_M=[{key:"calf",side:-1,t0:.06,t1:.7,in:.3},{key:"tib",side:1,t0:.08,t1:.75,in:.5}];
/* vue de face */
const UAF=[[-.16,3.6,3.0],[0,5.6,4.1],[.25,5.1,4.2],[.5,4.6,4.1],[.75,3.9,3.6],[1.03,2.9,2.8]];
const UAF_M=[{key:"bi",side:"c",t0:.26,t1:.92,in:.62,b:1.2},{key:"delt",side:0,t0:-.16,t1:.5,b:1.2}];
const FAF=[[-.05,3.0,2.9],[.2,3.6,3.2],[.5,3.0,2.7],[1,1.9,1.8]];
const FAF_M=[{key:"fore",side:"c",t0:0,t1:.75,in:.6}];
const TF=[[-.06,6.2,5.0],[.2,6.6,5.4],[.55,5.6,4.6],[.85,4.4,3.8],[1.03,3.6,3.3]];
const TF_M=[{key:"quad",side:"c",t0:.14,t1:1,in:.78}];
const SF=[[-.03,3.6,3.3],[.25,4.3,3.8],[.6,2.9,2.6],[1.02,1.9,1.8]];
const SF_M=[{key:"calf",side:"c",t0:.05,t1:.6,in:.7}];

/* ---------- Segment musclé ---------- */
function muscleGeo(at,oA,oP,m){
  const N=8,ts=lin(m.t0,m.t1,N),span=m.t1-m.t0;
  const w=t=>Math.pow(Math.max(0,Math.sin(Math.PI*(t-m.t0)/span)),.7);
  const fib=[],seg=[];let shape;
  if(m.side===1||m.side===-1){
    const o=m.side>0?oA:oP,sg=m.side,out=t=>o(t)-.3,inn=t=>out(t)-out(t)*(1-m.in)*w(t);
    const op=ts.map(t=>at(t,sg*out(t))),ip=ts.map(t=>at(t,sg*inn(t)));
    shape=[...op,...ip.slice(1,-1).reverse()];
    for(const r of [.3,.55,.8])fib.push(ts.map(t=>at(t,sg*(out(t)-(out(t)-inn(t))*r))));
    if(m.seg)for(const t of m.seg)seg.push([at(t,sg*out(t)),at(t,sg*inn(t))]);
  }else if(m.side===0){
    const tw=t=>{const x=(t-m.t0)/span;return x<.42?1:Math.max(.04,1-(x-.42)/.58);};
    const ap=ts.map(t=>at(t,(oA(t)-.3)*tw(t))),pp=ts.map(t=>at(t,-(oP(t)-.3)*tw(t)));
    shape=[...ap,...pp.reverse()];
    for(const r of [-.55,-.15,.25,.62])fib.push(ts.map(t=>at(t,r>0?(oA(t)-.3)*tw(t)*r:(oP(t)-.3)*tw(t)*r)));
  }else{
    const half=t=>((oA(t)+oP(t))/2)*m.in*w(t);
    const ap=ts.map(t=>at(t,half(t))),pp=ts.map(t=>at(t,-half(t)));
    shape=[...ap,...pp.slice(1,-1).reverse()];
    for(const r of [-.5,0,.5])fib.push(ts.map(t=>at(t,half(t)*r)));
  }
  return {d:smooth(shape,true),fib:fib.map(p=>smooth(p,false)),seg};
}
function glow(R,d){R.out.push('<path d="'+d+'" fill="#FF2418" opacity="'+((R.far?.1:.18)+(R.far?.18:.55)*R.k).toFixed(2)+'" filter="url(#fxGlow)"/>');}
function drawMuscle(R,g,key){
  R.out.push('<path d="'+g.d+'" fill="'+mcol(R,key)+'" stroke="'+C.edge+'" stroke-width=".35" stroke-opacity=".7"/>');
  const fc=fcol(R,key);
  for(const d of g.fib)R.out.push('<path d="'+d+'" fill="none" stroke="'+fc+'" stroke-width=".38" stroke-linecap="round"/>');
  for(const s of g.seg)R.out.push('<path d="'+poly(s)+'" stroke="'+(R.far?C.bodyF:C.body)+'" stroke-width=".8"/>');
}
function limb(R,A,B,s,prof,mus){
  const v=sub(B,A),L=Math.max(len(v),.01),u=[v[0]/L,v[1]/L],n=s>0?[-u[1],u[0]]:[u[1],-u[0]];
  const at=(t,o)=>[A[0]+u[0]*t*L+n[0]*o,A[1]+u[1]*t*L+n[1]*o];
  const bul=(t,side)=>{let b=0;for(const m of mus){if(!R.prim.has(m.key))continue;if(m.side!==0&&m.side!=="c"&&m.side!==side)continue;const c=(m.t0+m.t1)/2,hw=(m.t1-m.t0)/2,x=(t-c)/hw;if(x>-1&&x<1)b+=(m.b||1.2)*R.k*Math.pow(Math.cos(x*Math.PI/2),2);}return b;};
  const oA=t=>pin(prof,t,1)+bul(t,1),oP=t=>pin(prof,t,2)+bul(t,-1);
  const t0=prof[0][0],t1=prof[prof.length-1][0],ts=lin(t0,t1,10);
  const ant=ts.map(t=>at(t,oA(t))),post=ts.map(t=>at(t,-oP(t)));
  const e0=Math.min(Math.min(oA(t0),oP(t0))*.5/L,.35),e1=Math.min(Math.min(oA(t1),oP(t1))*.5/L,.35);
  const body=smooth([at(t0-e0,(oA(t0)-oP(t0))/2),...ant,at(t1+e1,(oA(t1)-oP(t1))/2),...post.reverse()],true);
  const gs=mus.map(m=>muscleGeo(at,oA,oP,m));
  gs.forEach((g,i)=>{if(R.prim.has(mus[i].key))glow(R,g.d);});
  R.out.push('<path d="'+body+'" fill="'+(R.far?C.bodyF:C.body)+'" stroke="'+C.edge+'" stroke-width=".6"/>');
  gs.forEach((g,i)=>drawMuscle(R,g,mus[i].key));
  return {at,oA,oP,L,u};
}
function bandPath(G,t0,t1,pad){const ts=lin(t0,t1,7);return smooth([...ts.map(t=>G.at(t,G.oA(t)+pad)),...ts.reverse().map(t=>G.at(t,-(G.oP(t)+pad)))],true);}
function fist(R,E,W){const c=pt(W,ang(E,W),1.4);R.out.push('<circle cx="'+f(c[0])+'" cy="'+f(c[1])+'" r="2.6" fill="'+(R.far?C.bodyF:C.body)+'" stroke="'+C.edge+'" stroke-width=".6"/>');}

/* ---------- Vue de profil ---------- */
const HEAD_S=[[-6,.4],[-5.6,-3.4],[-3.4,-6],[.2,-6.7],[3.6,-5.6],[5.6,-3.2],[6.1,-.8],[7.1,1.2],[6.2,1.9],[6.3,3],[5.7,4],[5.4,5.4],[3.4,6.6],[.6,6.3],[-1.6,5.2],[-3.8,4.4],[-5.6,2.6]];
const HAIR_S=[[-6.3,.9],[-6.1,-3.5],[-3.6,-6.5],[.3,-7.2],[3.9,-6.1],[5.9,-3.4],[5.1,-3.7],[2,-4.9],[-1,-4.6],[-3.4,-3.6],[-4.4,-1.2],[-5.1,1.5]];
const SHOE=[[-2.8,-1],[-1.8,-3.4],[1.6,-3],[5.2,-1.8],[8.6,-.6],[9.4,.8],[8.6,1.9],[-2.6,1.9]];
function headS(R,c,t){
  const ux=dir(t+90),uy=dir(t+180),T=p=>[c[0]+ux[0]*p[0]+uy[0]*p[1],c[1]+ux[1]*p[0]+uy[1]*p[1]];
  R.out.push('<path d="'+smooth(HEAD_S.map(T),true)+'" fill="'+C.body+'" stroke="'+C.edge+'" stroke-width=".6"/>');
  R.out.push('<path d="'+smooth(HAIR_S.map(T),true)+'" fill="'+C.hair+'"/>');
  const e=T([-.8,.8]);R.out.push('<ellipse cx="'+f(e[0])+'" cy="'+f(e[1])+'" rx="1.2" ry="1.6" fill="'+C.mus+'" transform="rotate('+f(t+90)+' '+f(e[0])+' '+f(e[1])+')"/>');
}
function shoeS(R,A,ft,far){
  const u=dir(ft),d=dir(ft+90),T=p=>[A[0]+u[0]*p[0]+d[0]*p[1],A[1]+u[1]*p[0]+d[1]*p[1]];
  R.out.push('<path d="'+smooth(SHOE.map(T),true)+'" fill="'+(far?"#0C0D0F":C.shoe)+'" stroke="'+C.edge+'" stroke-width=".5"/>');
  R.out.push('<path d="'+poly([T([-2.4,1.5]),T([8.6,1.5])])+'" stroke="'+(far?"#24282D":C.sole)+'" stroke-width=".9" stroke-linecap="round"/>');
}
function armS(R,S,E,W){limb(R,S,E,-1,UA,UA_M);limb(R,E,W,-1,FA,FA_M);fist(R,E,W);}
function legS(R,H,K,A,ft,far){
  const th=limb(R,H,K,-1,TH,TH_M);limb(R,K,A,-1,SH,SH_M);shoeS(R,A,ft,far);
  if(far)R.out.push('<path d="'+bandPath(th,-.06,.44,.6)+'" fill="'+C.shortsF+'"/>');
  return th;
}
function drawSide(R,J,P,a){
  const FL=a.farLeg||[-2.4,-.8];
  R.far=true;
  if(J.k2)legS(R,J.hip,J.k2,J.a2,P.ft2||0,true);else legS(R,add(J.hip,FL),add(J.k,FL),add(J.a,FL),P.ft||0,true);
  if(J.e2)armS(R,J.s,J.e2,J.w2);else if(J.ef)armS(R,J.sf,J.ef,J.wf);
  R.far=false;
  const tor=limb(R,J.hip,J.s,1,TO,TO_M);
  const th=legS(R,J.hip,J.k,J.a,P.ft||0,false);
  R.out.push('<path d="'+bandPath(tor,-.12,.16,.5)+'" fill="'+C.shorts+'"/><path d="'+bandPath(th,-.06,.45,.65)+'" fill="'+C.shorts+'"/>');
  R.out.push('<path d="'+poly([tor.at(.15,0),tor.at(0,0),th.at(.43,0)])+'" fill="none" stroke="'+C.stripe+'" stroke-width=".8" stroke-linejoin="round"/>');
  limb(R,tor.at(.98,.6),pt(J.head,P.t+180,3.4),1,NECK,[]);
  headS(R,J.head,P.t);
  armS(R,J.s,J.e,J.w);
}

/* ---------- Vue de face ---------- */
const TFO=[[3.6,-1.6],[8.6,.4],[11.8,2],[12.6,5.2],[12,9],[11.2,13.6],[9.6,19.4],[8.2,24.4],[8.3,29.2],[8.9,33.2],[6.4,36],[0,36.8]];
const PEC_F=[[1,3],[4.6,2.2],[9.8,2.9],[11.9,6],[9.7,10.6],[5.8,12.9],[1.4,12.3],[1,7.6]];
const OBL_F=[[5.3,14.8],[8.8,14.2],[9.4,19.6],[8,25.2],[5.4,30.6],[4.9,27],[5.3,20.6]];
const LAT_F=[[12.1,8.2],[11.3,13.8],[9.6,19.2],[9,17.4],[10.1,12.8],[10.8,9]];
const TRAP_F=[[3.9,-1],[8.4,.8],[11,2],[7.8,2.7],[4.3,1.6]];
const ABS_F=[[.9,14.4,4.5,18],[.9,18.8,4.5,22.6],[.95,23.4,4.4,27.4],[1,28.2,3.8,32]];

function torsoF(R,J,P){
  const o=J.s0,ts=P.ts||1,T=p=>[o[0]+p[0],o[1]+p[1]*ts];
  const out=[...TFO.slice(0,-1),TFO[TFO.length-1],...TFO.slice(0,-1).reverse().map(p=>[-p[0],p[1]])];
  const parts=[];
  for(const sg of [1,-1]){
    const M=p=>T([p[0]*sg,p[1]]);
    const pk=R.prim.has("pec")?1+.05*R.k:1;
    const pec=PEC_F.map(p=>M([6+(p[0]-6)*pk,7.5+(p[1]-7.5)*pk]));
    parts.push({key:"lat",g:{d:smooth(LAT_F.map(M),true),fib:[poly([M([11.6,9.6]),M([9.6,18])]),poly([M([11,9.4]),M([9.3,16.8])])],seg:[]}});
    parts.push({key:"abs",g:{d:smooth(OBL_F.map(M),true),fib:[poly([M([6,16]),M([8.6,15.4])]),poly([M([5.6,21]),M([9,19.6])]),poly([M([5.3,26]),M([8.3,24.6])])],seg:[]}});
    for(const r of ABS_F){const x0=r[0]*sg,x1=r[2]*sg,a=T([Math.min(x0,x1),r[1]]),b=T([Math.max(x0,x1),r[3]]);parts.push({key:"abs",g:{d:smooth([[a[0],a[1]+.6],[a[0]+.6,a[1]],[b[0]-.6,a[1]],[b[0],a[1]+.6],[b[0],b[1]-.6],[b[0]-.6,b[1]],[a[0]+.6,b[1]],[a[0],b[1]-.6]],true),fib:[],seg:[]}});}
    parts.push({key:"trap",g:{d:smooth(TRAP_F.map(M),true),fib:[poly([M([4.4,-.4]),M([9.6,1.7])])],seg:[]}});
    parts.push({key:"pec",g:{d:smooth(pec,true),fib:[[1.4,4],[1.4,6.2],[1.4,8.6],[1.8,11.2],[4.2,12.4]].map(p=>smooth([M(p),M([(p[0]+11.3)/2,(p[1]+6.2)/2+.4]),M([11.3,6.2])],false)),seg:[]}});
  }
  for(const p of parts)if(R.prim.has(p.key))glow(R,p.g.d);
  R.out.push('<path d="'+smooth(out.map(T),true)+'" fill="'+C.body+'" stroke="'+C.edge+'" stroke-width=".6"/>');
  for(const p of parts)drawMuscle(R,p.g,p.key);
  R.out.push('<path d="'+poly([T([0,3.4]),T([0,32])])+'" stroke="'+C.edge+'" stroke-width=".5" stroke-opacity=".6"/>');
}
function legF(R,H,K,A,s){
  const th=limb(R,H,K,s,TF,TF_M);limb(R,K,A,s,SF,SF_M);
  const c=[A[0]-s*1.1,A[1]+1.8];
  R.out.push('<ellipse cx="'+f(c[0])+'" cy="'+f(c[1])+'" rx="3.5" ry="2.3" fill="'+C.shoe+'" stroke="'+C.edge+'" stroke-width=".5"/>');

}
function armF(R,S,E,W,s){limb(R,S,E,s,UAF,UAF_M);limb(R,E,W,s,FAF,FAF_M);fist(R,E,W);}

  const tR=legF(R,J.hR,J.kR,J.aR,-1),tL=legF(R,J.hL,J.kL,J.aL,1);

  for(const th of [tR,tL]){R.out.push('<path d="'+bandPath(th,-.06,.42,.7)+'" fill="'+C.shorts+'"/><path d="'+poly([th.at(.02,th.oA(.02)+.5),th.at(.4,th.oA(.4)+.6)])+'" stroke="'+C.stripe+'" stroke-width=".8"/>');}

  armF(R,J.sR,J.eR,J.wR,-1);armF(R,J.sL,J.eL,J.wL,1);

/* ---------- Résolution des poses ---------- */
function solveS(P,a){
  const J={},H=P.hip;J.hip=H;
  J.s=pt(H,P.t,LEN.t*(P.ts||1));J.head=pt(J.s,P.t,LEN.n+LEN.h);
  let hand=null;
  if(a.lever)hand=pt(a.lever.p,P.lv,a.lever.R);else if(P.ik)hand=P.ik;
  if(hand&&P.el){J.e=P.el;J.w=hand;}
  else if(hand){const r=ik(J.s,hand,P.d||1,P.as||1);J.e=r[0];J.w=r[1];}
  else{J.e=seg(J.s,P.ua,LEN.ua);J.w=seg(J.e,P.fa,LEN.fa);}
  if(P.ua2!==undefined){J.e2=seg(J.s,P.ua2,LEN.ua);J.w2=seg(J.e2,P.fa2,LEN.fa);}
  else if(!a.uni){const o=a.farArm||[-1.8,-1.4];J.sf=add(J.s,o);J.ef=add(J.e,o);J.wf=add(J.w,o);}
  J.k=seg(H,P.th,LEN.th);J.a=seg(J.k,P.sh,LEN.sh);
  if(P.th2!==undefined){J.k2=seg(H,P.th2,LEN.th);J.a2=seg(J.k2,P.sh2,LEN.sh);}
  return J;
}
function solveF(P){
  const J={},H=P.hip;J.hip=H;
  const S0=[H[0],H[1]-LEN.t*(P.ts||1)];J.s0=S0;
  J.sR=[S0[0]+11.2,S0[1]+2.2*(P.ts||1)];J.sL=[S0[0]-11.2,S0[1]+2.2*(P.ts||1)];
  J.head=[S0[0],S0[1]-LEN.n-LEN.h-.5];
  J.eR=seg(J.sR,P.ua,LEN.ua);J.wR=seg(J.eR,P.fa,LEN.fa);
  const ua2=P.ua2!==undefined?P.ua2:mir(P.ua),fa2=P.fa2!==undefined?P.fa2:mir(P.fa);
  J.eL=seg(J.sL,ua2,LEN.ua);J.wL=seg(J.eL,fa2,LEN.fa);
  J.hR=[H[0]+5,H[1]];J.hL=[H[0]-5,H[1]];
  J.kR=seg(J.hR,P.th,LEN.th);J.aR=seg(J.kR,P.sh,LEN.sh);
  J.kL=seg(J.hL,mir(P.th),LEN.th);J.aL=seg(J.kL,mir(P.sh),LEN.sh);
  return J;
}

function ctrl(t,x,b,showRest){
  const rest=showRest?`<button class="cell rp" type="button" data-act="restpick" aria-label="Changer le temps de repos"><span class="lab">Repos</span><span class="val">${fmtSec(getR(b))}</span></button>`:`<div class="cell"><span class="lab">Repos</span><span class="val">0:00<small>enchaîne</small></span></div>`;
  return `<div class="ctrl"><div class="cell"><span class="lab">Charge</span><div class="stp"><button type="button" data-act="minus" data-ex="${x.id}" aria-label="Baisser la charge">−</button><input class="w" id="w-${t}-${x.id}" data-ex="${x.id}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${fmtW(getW(x))}" placeholder="—" aria-label="Charge ${esc(x.name)}"><button type="button" data-act="plus" data-ex="${x.id}" aria-label="Monter la charge">+</button></div><span class="unit">${x.unit}</span></div><div class="side"><div class="cell"><span class="lab">Objectif</span><span class="val">${x.sets} × ${esc(x.reps)}${x.per?`<small>${x.per}</small>`:""}</span></div>${rest}</div></div>`;
}
function pauses(key,b,n,d){
  const T=S.timer;let next=-1;for(let i=0;i<n;i++)if(!d[i]){next=i;break;}
  let h=`<div class="pzs" style="--n:${n}">`;
  for(let i=0;i<n;i++){
    const run=T&&T.key===key&&T.idx===i,cls=run?"run":d[i]?"done":i===next?"next":"";
    h+=`<button class="pz ${cls}" type="button" data-act="pause" data-i="${i}"><span><b>Pause ${i+1}</b><small data-pz="${i}">${run?"…":d[i]?"Faite ✓":fmtSec(getR(b))}</small></span></button>`;
  }
  return h+"</div>";
}
function hint(b,c,n){
  if(c>=n)return "Exercice validé. Touche une pause cochée si tu dois corriger.";
  const s=c+1,last=s===n;
  if(b.ss)return `${last?"<b>Dernier tour</b> : e":"E"}nchaîne <b>${b.items[0].n}</b> puis <b>${b.items[1].n}</b> sans t'arrêter, puis appuie sur <b>Pause ${s}</b>.`;
  if(c===0)return `Fais ta <b>série 1</b> (${b.reps} reps), puis appuie sur <b>Pause 1</b> : le repos se lance tout seul.`;
  return `${last?"<b>Dernière série</b>":`<b>Série ${s}</b>`} · ${b.reps} reps, puis appuie sur <b>Pause ${s}</b>.`;
}
function nextBlock(t,key){
  const bl=blocks(t),i=bl.findIndex(b=>bKey(t,b)===key);
  const order=[...bl.slice(i+1),...bl.slice(0,i)];
  return order.find(b=>cnt(bKey(t,b),nSets(b))<nSets(b))||null;
}
function nextLine(key,b,n){
  const d=dn(key);let s=-1;for(let i=0;i<n;i++)if(!d[i]){s=i;break;}
  if(s>=0)return b.ss?`Prochain : <b>tour ${s+1}</b> · ${b.items.map(x=>x.n).join(" + ")}`:`Prochaine : <b>série ${s+1}</b> · ${b.reps} reps · ${wTxt(b)}`;
  const nb=nextBlock(key.split(":")[0],key);
  return nb?`Ensuite : <b>${esc(nb.name)}</b>`:"Ensuite : <b>fin de séance</b>";
}

/* ===== Animations (uniquement celles visibles) ===== */
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const live=new Set();
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?live.add(e.target):live.delete(e.target);}),{rootMargin:"40px"}):null;
function bindAnims(){
  live.clear();if(io)io.disconnect();
  $("list").querySelectorAll("svg[data-anim]").forEach(svg=>{
    const a=ANIM[svg.dataset.anim];svg.innerHTML=build(a,a.hold?.7:.6);
    if(!reduce){if(io)io.observe(svg);else live.add(svg);}
  });
}
const PH=["Contraction","Pic","Descente lente","Étirement"];
let lastF=0;
function frame(t){
  if(t-lastF>30){lastF=t;
    for(const svg of live){
      const a=ANIM[svg.dataset.anim];svg.innerHTML=build(a,kAt(t,a));
      const c=t%3900,ph=a.hold?"Gainage":PH[c<1000?0:c<1400?1:c<3400?2:3],el=svg.parentNode.querySelector("[data-phase]");
      if(el&&el.textContent!==ph)el.textContent=ph;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== Son, vibration, écran allumé ===== */
let ac=null,wl=null;
function audio(){
  try{if(navigator.audioSession)navigator.audioSession.type="ambient";}catch(e){}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();}catch(e){}
}
function tone(at,fq,dur,vol){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=fq;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+dur+.02);}
function blip(){if(!ac)return;try{tone(ac.currentTime,740,.09,.25);}catch(e){}}
function beep(){
  try{if(navigator.vibrate)navigator.vibrate([200,90,200,90,320]);}catch(e){}
  if(!ac)return;try{const t0=ac.currentTime;tone(t0,880,.16,.45);tone(t0+.22,880,.16,.45);tone(t0+.44,1320,.32,.5);}catch(e){}
}
async function lockOn(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")wl=await navigator.wakeLock.request("screen");}catch(e){}}
function lockOff(){try{if(wl)wl.release();}catch(e){}wl=null;}

/* ===== Repos ===== */
let warnSec=null;
function onPause(key,i){
  const b=findB(key),n=nSets(b);let d=S.done[key]||[];
  if(d[i]){d[i]=false;S.done[key]=d;if(S.timer&&S.timer.key===key&&S.timer.idx===i)S.timer=null;save();render();return;}
  if(!S.sess){startSession(true);d=S.done[key]||[];}
  d[i]=true;S.done[key]=d;audio();
  const r=getR(b);warnSec=null;
  S.timer={key,idx:i,end:Date.now()+r*1000,total:r*1000,min:false};
  save();render();
}
function tickRest(){
  const T=S.timer,ov=$("rest"),mini=$("mini");
  if(!T){ov.hidden=true;mini.hidden=true;return;}
  const left=T.end-Date.now();
  if(left<=0){finishRest(T,left);return;}
  const sec=Math.ceil(left/1000),p=Math.max(0,Math.min(1,left/T.total)),b=findB(T.key),n=nSets(b),txt=fmtSec(sec);
  if(sec<=3&&warnSec!==sec){warnSec=sec;blip();}
  if(T.min){ov.hidden=true;mini.hidden=false;$("miniLbl").textContent=`Pause ${T.idx+1}/${n}`;$("miniTime").textContent=txt;$("miniBar").style.transform=`scaleX(${p})`;}
  else{
    ov.hidden=false;mini.hidden=true;ov.classList.toggle("warn",sec<=3);
    $("rLbl").innerHTML=`Pause ${T.idx+1}<small>/ ${n}</small>`;$("rTime").textContent=txt;
    $("rRing").style.strokeDashoffset=(552.9*(1-p)).toFixed(1);
    $("rEx").textContent=b.ss?b.items.map(x=>x.name).join(" + "):b.name;$("rNext").innerHTML=nextLine(T.key,b,n);
  }
  const sm=document.querySelector(`.blk[data-key="${T.key}"] [data-pz="${T.idx}"]`);if(sm)sm.textContent=txt;
}
function finishRest(T,left){
  S.timer=null;save();$("rest").hidden=true;$("mini").hidden=true;
  if(left>-90000){beep();showHype(T.key);}
  render();
}
let hypeT=0,hypeOpen=null;
function showHype(key){
  const t=key.split(":")[0],b=findB(key),n=nSets(b),d=dn(key),c=cnt(key,n);
  let kick="Pause terminée",ti,su,tg;hypeOpen=null;
  if(c<n){
    let s=0;for(let i=0;i<n;i++)if(!d[i]){s=i;break;}
    const last=n-c===1;[ti,su]=pick(last?MSG.last:MSG.next);
    if(last&&b.ss)ti="Dernier tour";
    tg=b.ss?`Tour ${s+1} · ${b.items.map(x=>x.n+" "+x.reps).join(" / ")}`:`Série ${s+1} · ${b.reps} reps · ${wTxt(b)}`;
  }else{
    const nb=nextBlock(t,key);
    if(nb){[ti,su]=pick(MSG.ex);su=su.replace("{n}",nb.name);kick="Exercice terminé";tg=`${nb.n} · ${nSets(nb)} × ${nb.ss?"tours":nb.reps}`;hypeOpen=bKey(t,nb);}
    else{[ti,su]=pick(MSG.all);kick="Dernière pause terminée";tg="Appuie sur Stop pour enregistrer";}
  }
  $("hyKick").textContent=kick;$("hyT").textContent=ti;$("hyS").textContent=su;$("hyTg").firstElementChild.textContent=tg;
  const h=$("hype");h.hidden=false;h.classList.remove("on");void h.offsetWidth;h.classList.add("on");
  clearTimeout(hypeT);hypeT=setTimeout(closeHype,5000);
}
function closeHype(){
  clearTimeout(hypeT);const h=$("hype");if(h.hidden)return;h.hidden=true;h.classList.remove("on");
  if(hypeOpen){const k=hypeOpen;hypeOpen=null;S.open[k.split(":")[0]]=k;save();render();scrollToKey(k);}
}
function scrollToKey(k){requestAnimationFrame(()=>{const el=document.querySelector(`.blk[data-key="${k}"]`);if(el)el.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});});}

/* ===== Séance ===== */
let confirmUntil=0;
function startSession(auto){
  audio();const t=S.tab;
  Object.keys(S.done).forEach(k=>{if(k.startsWith(t+":"))delete S.done[k];});
  S.sess={start:Date.now(),tab:t};
  if(!auto){const f=blocks(t)[0];S.open[t]=bKey(t,f);}
  save();lockOn();toast(auto?"Chrono lancé":"Séance lancée · go");
  if(!auto){render();scrollToKey(S.open[t]);}
}
function endSession(){
  const t=S.sess.tab,dur=Date.now()-S.sess.start,bl=blocks(t);
  let sets=0,tot=0,ex=0;bl.forEach(b=>{const n=nSets(b),c=cnt(bKey(t,b),n);sets+=c;tot+=n;if(c>=n)ex++;});
  S.hist[t]={date:Date.now(),dur,sets};S.sess=null;S.timer=null;save();lockOff();
  $("sumStats").innerHTML=`<div><b>${fmtClock(dur)}</b><span>Durée</span></div><div><b>${sets}/${tot}</b><span>Séries</span></div><div><b>${ex}/${bl.length}</b><span>Exercices</span></div>`;
  $("sumLoads").innerHTML=bl.flatMap(exs).map(x=>`<div><span>${esc(x.name)}</span><b>${esc(wTxt(x))}</b></div>`).join("");
  $("sum").hidden=false;render();
}
function tickClock(){
  const el=$("clock"),lb=$("clockLbl"),b=$("sessBtn"),now=Date.now();
  if(S.sess){
    el.textContent=fmtClock(now-S.sess.start);el.classList.add("live");lb.textContent="En cours · "+WK[S.sess.tab].short;
    if(now<confirmUntil){b.className="go sk confirm";$("sessTxt").innerHTML="Confirmer";}
    else{b.className="go sk run";$("sessTxt").innerHTML=STOP+"Stop";}
  }else{
    el.textContent="00:00";el.classList.remove("live");lb.textContent="Chrono séance";
    b.className="go sk";$("sessTxt").innerHTML=PLAY+"Démarrer";
  }
}
function tick(){tickClock();tickRest();}
setInterval(tick,250);
let toastT=0;
function toast(m){const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{e.hidden=true;},2600);}

/* ===== Interactions ===== */
$("sessBtn").addEventListener("click",()=>{
  const now=Date.now();
  if(!S.sess){startSession(false);return;}
  if(now>=confirmUntil){confirmUntil=now+3000;tickClock();return;}
  confirmUntil=0;endSession();
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b||b.dataset.tab===S.tab)return;
  S.tab=b.dataset.tab;save();render();window.scrollTo({top:0});
});
function setW(x,v){
  if(v!==null&&(isNaN(v)||v<0))v=0;
  S.w[x.id]=v===null?null:Math.round(v*100)/100;save();
  document.querySelectorAll(`.w[data-ex="${x.id}"]`).forEach(i=>{if(i!==document.activeElement)i.value=fmtW(S.w[x.id]);});
  document.querySelectorAll(".blk").forEach(el=>{const b=findB(el.dataset.key);if(b&&!b.ss&&b.id===x.id)el.querySelector(".sub").textContent=`${nSets(b)} × ${b.reps}${b.per?" "+b.per:""} · ${wTxt(b)}`;});
}
$("list").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const blk=el.closest(".blk"),key=blk&&blk.dataset.key,act=el.dataset.act;
  if(act==="toggle"){const t=S.tab,was=S.open[t]===key;S.open[t]=was?null:key;save();render();if(!was)scrollToKey(key);}
  else if(act==="minus"||act==="plus"){const x=findEx(el.dataset.ex),cur=getW(x),base=cur===null||cur===undefined||cur===""?0:+cur;setW(x,Math.max(0,base+(act==="plus"?x.step:-x.step)));}
  else if(act==="pause")onPause(key,+el.dataset.i);
  else if(act==="restpick"){const b=findB(key),i=PRESETS.indexOf(getR(b));S.r[b.id]=PRESETS[(i+1)%PRESETS.length];save();render();}
});
$("list").addEventListener("change",e=>{
  if(!e.target.classList.contains("w"))return;
  const x=findEx(e.target.dataset.ex),raw=e.target.value.trim().replace(",",".");
  setW(x,raw===""?null:parseFloat(raw));e.target.value=fmtW(S.w[x.id]);
});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("w"))e.target.blur();});
document.querySelector(".rbtns").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!S.timer)return;const r=b.dataset.r,now=Date.now();
  if(r==="skip")S.timer.end=now-1;
  else{const dv=+r*1000;S.timer.end=Math.max(now+1000,S.timer.end+dv);if(dv>0)S.timer.total+=dv;warnSec=null;}
  save();tick();
});
$("rMin").addEventListener("click",()=>{if(S.timer){S.timer.min=true;save();tick();}});
$("mini").addEventListener("click",()=>{if(S.timer){S.timer.min=false;save();tick();}});
$("hyGo").addEventListener("click",closeHype);
$("sumClose").addEventListener("click",()=>{$("sum").hidden=true;window.scrollTo({top:0});});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(S.sess)lockOn();tick();}});

render();
if(S.timer&&!S.timer.min)tick();

window.FONTE={ANIM:ANIM,build:build};
})();
</script>
